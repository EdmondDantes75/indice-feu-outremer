name: Calcul de l'indice

on:
  schedule:
    # ≈ 6 h 45 et 16 h 45 à Paris en hiver (7 h 45 et 17 h 45 en été) :
    # runs AROME de 00 h et 12 h UTC complets, observations de la veille publiées.
    - cron: '43 5 * * *'
    - cron: '43 15 * * *'
  workflow_dispatch:
    inputs:
      sonde:
        description: "Sonde : vérifier l'accès aux fichiers Météo-France sans publier"
        type: boolean
        default: false

concurrency:
  group: indice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calcul:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Tests hors réseau
        run: python -m pytest -q tests
      - name: Calcul
        run: python -m ifo.run ${{ inputs.sonde && '--sonde' || '' }}
      - name: Publication des résultats
        if: ${{ !inputs.sonde }}
        run: |
          git config user.name "indice-feu-outremer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/widgets
          git commit -m "Indice du $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
      - name: Dépôt des images sur le site
        # Facultatif : actif seulement si les secrets SITE_* sont renseignés (Settings > Secrets and variables > Actions).
        if: ${{ !inputs.sonde }}
        env:
          HOTE: ${{ secrets.SITE_HOTE }}
          PROTOCOLE: ${{ secrets.SITE_PROTOCOLE }}
          UTILISATEUR: ${{ secrets.SITE_UTILISATEUR }}
          MOT_DE_PASSE: ${{ secrets.SITE_MOT_DE_PASSE }}
          DOSSIER: ${{ secrets.SITE_DOSSIER }}
        run: |
          if [ -z "$HOTE" ]; then echo "Dépôt sur le site non configuré : images servies par GitHub Pages seulement."; exit 0; fi
          sudo apt-get install -y -qq lftp > /dev/null
          case "${PROTOCOLE:-sftp}" in
            sftp) URL="sftp://$HOTE"; REGLAGES="set sftp:auto-confirm yes;" ;;
            ftp|ftps) URL="ftp://$HOTE"; REGLAGES="set ftp:ssl-force true; set ftp:ssl-protect-data true;" ;;
            *) echo "SITE_PROTOCOLE doit valoir sftp ou ftps"; exit 1 ;;
          esac
          D="${DOSSIER:-indice-feu-outremer}"
          # 1) envoi de tous les fichiers, sans rien supprimer
          # 2) dans commune/ seulement : suppression des images .svg de communes qui n'existent plus ;
          #    tout autre fichier du site reste hors d'atteinte, même si le chemin est mal réglé
          lftp -u "$UTILISATEUR","$MOT_DE_PASSE" "$URL" -e "$REGLAGES set net:max-retries 3; set net:timeout 30; \
            mirror -R --no-perms --parallel=4 docs/widgets \"$D\"; \
            mirror -R --no-perms --delete --include-glob '*.svg' docs/widgets/commune \"$D/commune\"; quit"
          echo "Images déposées dans $D"
