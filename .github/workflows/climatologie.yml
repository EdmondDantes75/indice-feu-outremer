name: Seuils locaux (climatologie)

on:
  schedule:
    - cron: '23 3 2 * *'   # le 2 de chaque mois
  workflow_dispatch:

concurrency:
  group: climatologie
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  climatologie:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Centiles 1995-2024 par station
        run: python -m ifo.climatologie --debut 1995 --fin 2024
      - name: Publication
        run: |
          git config user.name "indice-feu-outremer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/climatologie.json
          git commit -m "Seuils locaux $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase
          git push
